[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    live_pocketbase: runs against a real PocketBase; skipped when none is reachable
    live_gemini: runs against the live Gemini API; needs a real GOOGLE_API_KEY
    live_graph: runs against a real Neo4j; needs NEO4J_URL and a reachable instance
addopts = -m "not live_pocketbase and not live_gemini and not live_graph"
